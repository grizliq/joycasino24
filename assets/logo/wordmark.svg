<svg width="360" height="120" viewBox="0 0 360 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="JoyCasino">
  <defs>
    <linearGradient id="jcEm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1E6F4B"/>
      <stop offset="55%" stop-color="#134E33"/>
      <stop offset="100%" stop-color="#0B3624"/>
    </linearGradient>
    <linearGradient id="jcGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFE9A8"/>
      <stop offset="45%" stop-color="#F5D387"/>
      <stop offset="100%" stop-color="#B87F1E"/>
    </linearGradient>
    <linearGradient id="jcTxt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#F5D387"/>
      <stop offset="100%" stop-color="#B47A1B"/>
    </linearGradient>
    <filter id="jcSh" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Внешняя рамка-скалоп -->
  <g filter="url(#jcSh)">
    <path d="M 30 20
             Q 40 8 60 12
             L 300 12
             Q 320 8 330 20
             Q 340 30 340 60
             Q 340 90 330 100
             Q 320 112 300 108
             L 60 108
             Q 40 112 30 100
             Q 20 90 20 60
             Q 20 30 30 20 Z"
          fill="url(#jcGold)" stroke="#8A5D14" stroke-width="1.2"/>
    <!-- Внутренний изумрудный овал -->
    <path d="M 40 30
             Q 48 22 62 24
             L 298 24
             Q 312 22 320 30
             Q 328 38 328 60
             Q 328 82 320 90
             Q 312 98 298 96
             L 62 96
             Q 48 98 40 90
             Q 32 82 32 60
             Q 32 38 40 30 Z"
          fill="url(#jcEm)" stroke="#0B3624" stroke-width="1.4"/>
  </g>

  <!-- Уголки-виньетки (декор) -->
  <g fill="url(#jcGold)" opacity="0.9">
    <circle cx="46"  cy="60" r="4"/>
    <circle cx="314" cy="60" r="4"/>
    <path d="M56 40 L60 44 L64 40 L60 36 Z"/>
    <path d="M296 80 L300 84 L304 80 L300 76 Z"/>
  </g>

  <!-- JOYCASINO -->
  <text x="180" y="72"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-weight="700"
        font-size="34"
        letter-spacing="3"
        fill="url(#jcTxt)"
        stroke="#5A3B0A"
        stroke-width="0.8"
        paint-order="stroke fill">JOYCASINO</text>
</svg>
